name: Build xmhuffman Python Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel cython build

      # Cross-architecture builds on Linux (aarch64, riscv64) via QEMU.
      - name: Set up QEMU
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,riscv64

      # macOS: build a single universal2 wheel covering x86_64 + arm64.
      - name: Build universal2 wheel for macOS
        if: matrix.os == 'macos-latest'
        run: |
          export ARCHFLAGS="-arch x86_64 -arch arm64"
          export MACOSX_DEPLOYMENT_TARGET="11.0"
          python -m build --wheel
        env:
          CIBW_ARCHS_MACOS: "universal2"
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      # Linux: cibuildwheel produces manylinux wheels (x86_64 + aarch64 +
      # riscv64). The emulated arches are built under QEMU.
      - name: Build manylinux wheels for Linux
        if: matrix.os == 'ubuntu-latest'
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: cp${{ matrix.python-version == '3.10' && '310' || matrix.python-version == '3.11' && '311' || matrix.python-version == '3.12' && '312' || matrix.python-version == '3.13' && '313' || matrix.python-version == '3.14' && '314' || '39' }}-*
          CIBW_ARCHS_LINUX: "x86_64 aarch64 riscv64"
          CIBW_SKIP: "*-musllinux_*"

      # Windows: a plain build is fine; setuptools picks the right MSVC.
      - name: Build wheel for Windows
        if: matrix.os == 'windows-latest'
        run: |
          python -m build --wheel

      - name: Store built wheels (non-Linux)
        if: matrix.os != 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl

      - name: Store built wheels (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: wheelhouse/*.whl

  # Smoke-test the native-architecture wheels.
  test_wheels:
    needs: build_wheels
    name: Test wheels on ${{ matrix.os }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links dist --no-index xmhuffman

      - name: Run end-to-end tests
        run: |
          python e2e_test.py

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel cython build

      - name: Build sdist
        run: python -m build --sdist

      - name: Store sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publish to PyPI on GitHub release. Uses trusted publishing (OIDC) —
  # no API token needed; configure the PyPI project to trust this workflow.
  deploy:
    if: github.event_name == 'release'
    needs: [build_wheels, test_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten directory structure
        run: |
          mkdir -p flat_dist
          find dist -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} flat_dist/ \;
          rm -rf dist
          mv flat_dist dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
